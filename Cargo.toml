[package]
name = "clipboard-history"
version = "0.2.0"
edition = "2024"
authors = ["Tarvi Tasane"]

[dependencies]
serde = { version = "1", features = ["derive"] }
thiserror = "2"
zeroize = "1.9.0"

# Only needed by the backend (non-wasm) `From` impls on `AppError`. Gated so the
# wasm/trunk build of the `ui` crate never pulls these in.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
serde_json = "1"
tauri-plugin-store = "2"

[workspace]
resolver = "2"
members = ["frontend", "backend"]
